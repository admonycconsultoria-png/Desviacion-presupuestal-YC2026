[build]
  publish = "."
  functions = "netlify/functions"

# SPA-style fallback no es necesario (no hay router), pero dejamos cabeceras
# básicas de seguridad y de caché para los archivos estáticos.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[functions]
  node_bundler = "esbuild"
