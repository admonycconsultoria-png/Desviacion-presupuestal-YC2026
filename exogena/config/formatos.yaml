# =====================================================================
# Layouts de formatos en el orden de columnas del prevalidador DIAN.
# Si la DIAN cambia la versión de un formato, SOLO se edita este archivo.
#
# Claves:
#   version        versión del formato según Res. 227/2025 art. 1.3.10.1 y sus modificaciones
#   version_por_anio  versión que aplica a años gravables anteriores
#   verificado     true = versión confirmada en el texto de la resolución
#   columnas       lista [campo_interno, "Encabezado del prevalidador"], en el orden del prevalidador.
#                  Los encabezados son el texto EXACTO de la fila 2 de la hoja F#### del prevalidador.
#                  El orden de columnas NO se marca a mano: se verifica automáticamente contra los
#                  prevalidadores de config/prevalidadores/ de la MISMA versión
#                  (python -m exogena_engine.prevalidador <archivo.xlsm> --guardar).
#   modo           por_tercero | sin_tercero | insumo_externo
#   concepto       true si el formato lleva columna de concepto
#   requiere       campos del tercero obligatorios -> validación
# =====================================================================

"1001":
  nombre: "Pagos o abonos en cuenta y retenciones practicadas"
  version: 11          # v11 aplica desde AG 2026 (Res. 233/2025 art. 3 y par. 8 art. 1.3.9.1.3)
  version_por_anio: { 2025: 10, 2024: 10 }
  verificado: true
  # cuentas que el asistente pregunta una por una para este formato
  universo: ["14", "15", "16", "17", "5", "6", "7", "2365", "2367"]
  que_reporta: "Pagos o abonos en cuenta (gastos, costos, compras de inventario y activos) y retenciones practicadas a cada tercero"
  modo: por_tercero
  concepto: true
  columnas:
    - [concepto, "Concepto"]
    - [tipo_documento, "Tipo de documento"]
    - [numero_identificacion, "Número identificación"]
    - [primer_apellido, "Primer apellido del informado"]
    - [segundo_apellido, "Segundo apellido del informado"]
    - [primer_nombre, "Primer nombre del informado"]
    - [otros_nombres, "Otros nombres del informado"]
    - [razon_social, "Razón social informado"]
    - [direccion, "Dirección"]
    - [codigo_departamento, "Código dpto"]
    - [codigo_municipio, "Código mcp"]
    - [pais, "País de Residencia o domicilio"]
    - [pago_deducible, "Pago o abono en cuenta deducible"]
    - [pago_no_deducible, "Pago o abono en cuenta NO deducible"]
    - [iva_deducible, "IVA mayor valor del costo o gasto, deducible"]
    - [iva_no_deducible, "IVA mayor valor del costo o gasto no deducible"]
    - [ret_renta, "Retención en la fuente practicada Renta"]
    - [ret_asumida, "Retención en la fuente asumida Renta"]
    - [ret_iva_comun, "Retención en la fuente practicada IVA a responsables del IVA"]
    - [ret_iva_no_dom, "Retención en la fuente practicada IVA a no residentes o no domiciliados"]
  requiere: [direccion, codigo_departamento, codigo_municipio, pais]

